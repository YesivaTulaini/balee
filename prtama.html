<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Multi-Halaman</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="loginPage">
        <div class="login-container">
            <h2>Login</h2>
            <form id="loginForm">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>

    <div id="mainContent" class="hidden">
        <header>
            <h1>Selamat Datang</h1>
            <nav>
                <button onclick="showPage('home')">Home</button>
                <button onclick="showPage('about')">Tentang</button>
                <button onclick="showPage('contact')">Kontak</button>
                <button onclick="logout()">Logout</button>
            </nav>
        </header>

        <section id="home" class="page">
            <h2>Halaman Utama</h2>
            <p>Ini adalah halaman utama.</p>
        </section>

        <section id="about" class="page hidden">
            <h2>Tentang Kami</h2>
            <p>Informasi tentang website ini.</p>
        </section>

        <section id="contact" class="page hidden">
            <h2>Kontak</h2>
            <p>Hubungi kami melalui email atau media sosial.</p>
        </section>
    </div>
</body>
</html>
